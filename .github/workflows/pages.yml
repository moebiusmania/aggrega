# Publishes the landing page (public/) to GitHub Pages when it changes on main.
# Static files only: nothing is built, and the app's CI and release builds don't run.
# Requires Settings → Pages → Source: "GitHub Actions".
name: Deploy landing page

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
  # Redeploy by hand (Actions tab, or `gh workflow run pages.yml`); main only, see below.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Upload and deploy run as separate jobs (GitHub's own Pages template): deploying in the
  # same job as the upload can query the artifact before it is listed, and re-running the
  # job then uploads a second "github-pages" artifact that deploy-pages refuses.
  build:
    # A manual run can pick any branch; only main gets published.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
