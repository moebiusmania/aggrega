# Flatpak manifest. Builds this checkout offline: the crates come from
# cargo-sources.json, which packaging/flatpak/build.sh (and the release
# workflow) generate from Cargo.lock with flatpak-cargo-generator. It isn't
# committed, so it can never drift from Cargo.lock.
id: io.github.moebiusmania.Aggrega
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: aggrega
finish-args:
  # Feeds, thumbnails, article pages and LAN sync (UDP 47811, TCP 47812).
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # OpenGL for the GPU renderer.
  - --device=dri
  # No filesystem access: the database and thumbnails live in the sandbox's
  # XDG dirs (~/.var/app/<id>/), OPML files go through the file chooser portal,
  # and links open through the OpenURI portal.

modules:
  - name: aggrega
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/aggrega/cargo
        CARGO_NET_OFFLINE: "true"
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked
      - install -Dm755 target/release/aggrega /app/bin/aggrega
      - install -Dm644 assets/aggrega.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 packaging/aggrega.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-icon=${FLATPAK_ID} /app/share/applications/${FLATPAK_ID}.desktop
      - |
        version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%F)/" \
          packaging/flatpak/${FLATPAK_ID}.metainfo.xml > metainfo.xml
        install -Dm644 metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 -t /app/share/licenses/${FLATPAK_ID} LICENSE assets/fonts/OFL.txt
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - dist
          - .git
          - .flatpak-builder
          - packaging/flatpak/build
          - packaging/flatpak/repo
      - cargo-sources.json
